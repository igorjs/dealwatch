# Backstop for the leaks GitHub's own secret scanning cannot see. That
# scanner matches known PROVIDER formats; the credentials this repo handles
# are supermarket session cookies, which match no provider pattern, and the
# repo's non-provider pattern setting is not available on this plan.
#
# This job holds NO secrets and needs none, which is why it is safe to run on
# pull_request (including from forks) while the fetcher workflow is not.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: a secret removed from the tip is still a leak if it
          # sits in an earlier commit.
          fetch-depth: 0
      - run: ./scripts/scan-secrets.sh
